<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; background: #ece8e1; }
    .leaflet-control-attribution {
      font-size: 10px !important;
      background: rgba(255,255,255,.72) !important;
      color: #6b6560 !important;
    }
    .saparts-map-pin { background: transparent; border: 0; }
    .saparts-map-pin span {
      display: block; width: 14px; height: 14px; border-radius: 999px;
      background: #2c2a26; border: 2px solid #f4efe6;
      box-shadow: 0 1px 4px rgba(0,0,0,.22);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const lat = parseFloat(q.get("lat") || "");
    const lon = parseFloat(q.get("lon") || "");
    const name = q.get("name") || "";
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
      document.body.textContent = "";
    } else {
      const map = L.map("map", { scrollWheelZoom: false, zoomControl: true }).setView([lat, lon], 15);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OpenStreetMap &copy; CARTO",
        subdomains: "abcd",
        maxZoom: 19
      }).addTo(map);
      const icon = L.divIcon({
        className: "saparts-map-pin",
        html: "<span></span>",
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
      L.marker([lat, lon], { icon: icon, title: name }).addTo(map);
    }
  </script>
</body>
</html>
